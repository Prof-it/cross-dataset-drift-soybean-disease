[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-dataset-drift-soybean-disease"
version = "0.1.0"
description = "Cross-dataset robustness of soybean disease classifiers under distribution shift."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Maximilian Stahl" }]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=1.0.15",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

# src/ holds the importable package tree (src.data, src.models, ...).
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
